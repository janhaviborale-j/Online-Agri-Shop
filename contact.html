<!DOCTYPE html>
<html>
<head>
    <title>Contact Us | Online Agri Shop</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .contact-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 85vh;
        }

        .contact-box {
            background: white;
            padding: 30px;
            width: 350px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
            text-align: center;
        }

        .contact-box img {
            width: 80px;
            margin-bottom: 10px;
        }

        .contact-box h2 {
            margin-bottom: 20px;
            color: #2e7d32;
        }

        .contact-box input,
        .contact-box textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
        }

        .contact-box textarea {
            height: 80px;
            resize: none;
        }

        .contact-box button {
            background: #2e7d32;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            margin-top: 10px;
        }

        .contact-box button:hover {
            background: #1b5e20;
        }

        .contact-info {
            margin-top: 15px;
            font-size: 14px;
            color: #555;
        }
    </style>
</head>

<body>

<header>
    <h1>🌾 Online Agri Shop</h1>
</header>

<nav class="navbar">
    <a href="index.html">Home</a>
    <a href="products.html">Products</a>
    <a href="login.html">Login</a>
    <a href="register.html">Register</a>
    <a href="contact.html">Contact</a>
</nav>

<div class="contact-container">
    <div class="contact-box">

        <img src="https://cdn-icons-png.flaticon.com/512/3059/3059997.png">

        <h2>Contact Us</h2>

        <input type="text" placeholder="SJ store">
        <input type="email" placeholder="sjstore@gmail.com">
        <textarea placeholder="Enter Your Message"></textarea>

        <button>Send Message</button>

        <div class="contact-info">
            <p>📞 +91 7894563214</p>
            <p>📧 support@agrishop.com</p>
        </div>

    </div>
</div>

<footer>
    <p>© 2026 Online Agri Shop | College Project</p>
</footer>

</body>
</html>
